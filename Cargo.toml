[workspace]
resolver = "3"
members = ["crates/*", "apps/nous-kernel"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "sync", "time", "net", "io-std", "io-util"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
opendal = { version = "=0.58.2", default-features = false, features = ["services-fs", "executors-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
toml = "0.9"
tempfile = "3"
futures = "0.3"
postgresql_embedded = { version = "=0.21.0", default-features = false, features = ["bundled", "tokio", "tls-rustls-ring"] }
usearch = "=2.26.2"
tantivy = "=0.26.1"
nalgebra = "=0.34.1"
roaring = { version = "=0.11.5", features = ["serde"] }
arc-swap = "=1.9.2"
async-trait = "=0.1.89"
prost = "=0.14.4"
prost-types = "=0.14.4"
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
tonic-health = "=0.14.6"
tokio-stream = { version = "0.1", features = ["net"] }
nous-protocol = { path = "crates/protocol" }
nous-core = { path = "crates/core" }
nous-subject-core = { path = "crates/subject-core" }
nous-cognitive-runtime = { path = "crates/cognitive-runtime" }
nous-material = { path = "crates/material" }
nous-material-service = { path = "crates/material-service" }
nous-object-store = { path = "crates/object-store" }
nous-memory-domain = { path = "crates/memory-domain" }
nous-authority-store = { path = "crates/authority-store" }
nous-cognitive-retrieval = { path = "crates/cognitive-retrieval" }
nous-serving = { path = "crates/serving" }
nous-memory-service = { path = "crates/memory-service" }
nous-self-domain = { path = "crates/self-domain" }
nous-self-service = { path = "crates/self-service" }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
too_many_lines = "warn"
excessive_nesting = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
large_futures = "warn"
large_enum_variant = "warn"
fn_params_excessive_bools = "warn"
