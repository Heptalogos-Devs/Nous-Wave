name: Acceptance

on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Install Rust Buf plugins
        run: |
          cargo install protoc-gen-prost --version 0.5.0 --locked
          cargo install protoc-gen-tonic --version 0.5.0 --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0,cargo-deny@0.20.2,cargo-shear@1.13.4,cargo-dupes@0.2.1,osv-scanner@2.6.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Deterministic acceptance
        run: just acceptance
