too-many-lines-threshold = 120
excessive-nesting-threshold = 5
too-many-arguments-threshold = 8
type-complexity-threshold = 220
future-size-threshold = 32768
enum-variant-size-threshold = 256

# PRE_PRODUCTION: Clippy should not suppress useful refactors merely to preserve
# the current exported API shape.
avoid-breaking-exported-api = false
