min_nodes = 15
min_lines = 5
similarity_threshold = 0.85

# Keep authored production code in the report; generated, test and ignored local data trees are excluded.
exclude = ["target", "data", "tests", "benches", "generated"]

exclude_tests = true

max_exact_duplicates = 16
max_exact_percent = 6.5

max_near_duplicates = 10
max_near_percent = 10.0
