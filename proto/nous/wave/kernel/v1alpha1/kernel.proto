syntax = "proto3";
package nous.wave.kernel.v1alpha1;
import "nous/wave/kernel/v1alpha1/longitudinal.proto";
import "nous/wave/v1alpha1/journal.proto";
import "nous/wave/v1alpha1/types.proto";
import "google/protobuf/empty.proto";
import "nous/wave/v1alpha1/identity.proto";
import "nous/wave/v1alpha1/management.proto";
import "nous/wave/kernel/v1alpha1/model.proto";

message UploadHeader { string subject_id = 1; string media_type = 2; }
message UploadChunk { oneof part { UploadHeader header = 1; bytes content = 2; } }
message DownloadRequest { string subject_id = 1; string artifact_id = 2; optional uint64 start = 3; optional uint64 end = 4; }
message DownloadChunk { bytes content = 1; }
service ArtifactStreamService {
  rpc UploadArtifact(stream UploadChunk) returns (nous.wave.v1alpha1.Artifact);
  rpc DownloadArtifact(DownloadRequest) returns (stream DownloadChunk);
}

service AuthorityService {
  rpc RefreshMaintenance(RefreshMaintenanceRequest) returns (google.protobuf.Empty);
  rpc PlanMaintenance(PlanMaintenanceRequest) returns (MaintenancePlan);
  rpc GetMaintenancePolicy(nous.wave.v1alpha1.SubjectRequest) returns (MaintenancePolicy);
  rpc ClaimMaintenance(ClaimMaintenanceRequest) returns (ClaimMaintenanceResponse);
