version: v2
plugins:
  - local: protoc-gen-prost
    out: crates/protocol/src/generated
  - local: protoc-gen-tonic
    out: crates/protocol/src/generated
    opt:
      - no_client
  - local: protoc-gen-es
    out: packages/protocol-ts/src/generated
    opt:
      - target=ts
      - import_extension=js
inputs:
  - directory: proto
